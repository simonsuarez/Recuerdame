<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Recuerdame — En construcción</title>
  <!-- Tailwind por CDN: no hay que instalar nada -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gradient-to-br from-indigo-600 via-purple-600 to-pink-500 text-white">
  <div class="max-w-3xl mx-auto px-6 py-24 text-center">
    <span class="inline-flex items-center gap-2 bg-white/10 backdrop-blur px-4 py-2 rounded-full text-sm">
      <span class="w-2 h-2 rounded-full bg-amber-400 animate-pulse"></span>
      Sitio en construcción
    </span>

    <h1 class="mt-6 text-4xl md:text-6xl font-extrabold leading-tight">
      Estamos trabajando para ti 🛠️
    </h1>
    <p class="mt-3 text-white/90 text-lg">
      Muy pronto podrás gestionar tus recordatorios de forma simple y rápida.
    </p>

    <a href="recordatorios.html"
       class="mt-10 inline-flex items-center gap-2 bg-white text-indigo-700 hover:bg-white/90 px-5 py-3 rounded-xl font-semibold shadow-lg">
      Ver recordatorios
      <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7l5 5m0 0l-5 5m5-5H6"/>
      </svg>
    </a>

    <footer class="mt-16 text-white/70 text-sm">
      © <span id="y"></span> Recuerdame
    </footer>
  </div>
  <script>document.getElementById('y').textContent = new Date().getFullYear();</script>
</body>
</html>
