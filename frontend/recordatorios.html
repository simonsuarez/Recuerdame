<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Recuerdame — Recordatorios</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-900 text-white">
  <header class="border-b border-white/10">
    <div class="max-w-5xl mx-auto px-6 py-4 flex items-center justify-between">
      <a href="index.html" class="font-bold">← Volver</a>
      <h1 class="text-xl font-semibold">Recordatorios</h1>
      <div></div>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-6 py-8 grid md:grid-cols-2 gap-8">
    <!-- Formulario -->
    <section class="bg-white/5 border border-white/10 rounded-2xl p-6">
      <h2 class="text-lg font-semibold mb-4">Nuevo recordatorio</h2>
      <form id="form" class="space-y-4">
        <div>
          <label class="block text-sm mb-1">Título *</label>
          <input name="titulo" class="w-full rounded-lg px-3 py-2 bg-slate-800 border border-white/10 focus:outline-none" placeholder="Ej. Pagar cuentas" required />
        </div>
        <div>
          <label class="block text-sm mb-1">Descripción</label>
          <textarea name="descripcion" class="w-full rounded-lg px-3 py-2 bg-slate-800 border border-white/10 focus:outline-none" rows="3" placeholder="Opcional"></textarea>
        </div>
        <div>
          <label class="block text-sm mb-1">Fecha</label>
          <input type="datetime-local" name="fecha" class="w-full rounded-lg px-3 py-2 bg-slate-800 border border-white/10 focus:outline-none" />
        </div>
        <button class="mt-2 bg-indigo-600 hover:bg-indigo-500 px-4 py-2 rounded-lg font-medium">Crear</button>
      </form>
    </section>

    <!-- Lista -->
    <section class="bg-white/5 border border-white/10 rounded-2xl p-6">
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-lg font-semibold">Tus recordatorios</h2>
        <button onclick="location.reload()" class="text-sm px-3 py-2 rounded-lg bg-white/10 hover:bg-white/20">Recargar</button>
      </div>
      <ul id="list" class="space-y-3"></ul>
    </section>
  </main>

  <div id="toast" class="transition-opacity duration-300 opacity-0"></div>

  <!-- Importa tu JS como módulo -->
  <script type="module" src="./app.js"></script>
</body>
</html>
